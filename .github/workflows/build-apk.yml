name: بناء ملف APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: بناء إصدار أندرويد
    runs-on: ubuntu-latest

    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: تهيئة Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تهيئة Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: تنزيل الحزم
        run: flutter pub get

      - name: تحليل الكود
        run: flutter analyze

      - name: تشغيل الاختبارات
        run: flutter test

      # المفاتيح تُقرأ من أسرار المستودع (Settings > Secrets and variables > Actions).
      # بلا أسرار يُبنى التطبيق في وضع البيانات التجريبية ويعمل كاملاً.
      - name: بناء APK
        run: |
          flutter build apk --release \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: رفع ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: mawkib-zahra-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: رفع رموز التصحيح
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/symbols
          retention-days: 30
