# ذاكرة Gradle مضبوطة لبيئات محدودة الموارد.
# القيمة الافتراضية في قوالب Flutter هي 8G وهي تقتل البناء على أي جهاز
# أو حاوية بذاكرة 4 غيغا أو أقل. هذه القيم تبني المشروع بنجاح على 4 غيغا.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.daemon.jvmargs=-Xmx640m
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
